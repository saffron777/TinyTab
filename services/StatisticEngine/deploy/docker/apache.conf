# httpd.conf mínimo para el contenedor oficial httpd:2.4 como proxy inverso de StatisticEngine.
# No sirve ficheros: solo reenvía a http://statisticengine:8080 (red interna de compose).

ServerRoot "/usr/local/apache2"
ServerName statisticengine
Listen 80

LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule proxy_module        modules/mod_proxy.so
LoadModule proxy_http_module   modules/mod_proxy_http.so
LoadModule headers_module      modules/mod_headers.so
LoadModule deflate_module      modules/mod_deflate.so
LoadModule filter_module       modules/mod_filter.so
LoadModule mime_module         modules/mod_mime.so

User  www-data
Group www-data

ErrorLog /proc/self/fd/2
LogLevel warn
<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
</IfModule>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Require all denied
</Directory>

# El TLS se termina en el ingress/servidor que publique este contenedor. Si ese salto es HTTPS,
# descomenta la cabecera para que el servicio sepa que el cliente original usó https.
#RequestHeader set X-Forwarded-Proto "https"

ProxyRequests Off
ProxyPreserveHost On

# Análisis y operaciones de datos usan el perfil de timeout "heavy" (300 s por defecto).
ProxyTimeout 330

ProxyPass        / http://statisticengine:8080/
ProxyPassReverse / http://statisticengine:8080/

LimitRequestBody 33554432
AddOutputFilterByType DEFLATE application/json application/problem+json text/html text/plain
