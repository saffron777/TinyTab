# StatisticEngine — proxy inverso en una SUBRUTA (cuando ya hay un vhost en uso).
#
# Expone SOLO la API y los probes:
#   https://app.example.com/statisticengine/api/v1/...
#   https://app.example.com/statisticengine/health/...
#
# Aviso: la UI interactiva (Scalar) y /openapi/v1.json usan rutas ABSOLUTAS y no funcionan
# colgadas de una subruta sin UsePathBase en el servicio. Viven en el puerto loopback del
# servidor; para publicarlas usa la topología de subdominio (statisticengine.conf).

<VirtualHost *:443>
    ServerName app.example.com

    SSLEngine on
    SSLCertificateFile    "C:/Apache24/conf/certs/app.crt"
    SSLCertificateKeyFile "C:/Apache24/conf/certs/app.key"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 330
    RequestHeader set X-Forwarded-Proto "https"

    # /statisticengine/api/v1/analyses  ->  http://127.0.0.1:5080/api/v1/analyses
    ProxyPass        /statisticengine/api    http://127.0.0.1:5080/api
    ProxyPassReverse /statisticengine/api    http://127.0.0.1:5080/api

    ProxyPass        /statisticengine/health http://127.0.0.1:5080/health
    ProxyPassReverse /statisticengine/health http://127.0.0.1:5080/health

    LimitRequestBody 33554432

    ErrorLog  "logs/statisticengine-error.log"
    CustomLog "logs/statisticengine-access.log" combined
</VirtualHost>
