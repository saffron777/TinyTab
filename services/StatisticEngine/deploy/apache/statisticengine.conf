# StatisticEngine — proxy inverso con Apache en un subdominio (topología recomendada).
#
# Ubicación en Windows : C:\Apache24\conf\extra\statisticengine.conf  (+ Include en httpd.conf)
# Ubicación en Debian  : /etc/apache2/sites-available/statisticengine.conf
#
# Requiere: proxy, proxy_http, headers, ssl (opcional: deflate, filter, rewrite).
# El servicio escucha SOLO en loopback (127.0.0.1:5080); Apache es la única entrada pública.

<VirtualHost *:443>
    ServerName stats.example.com
    # ServerAlias www.stats.example.com

    SSLEngine on
    SSLCertificateFile    "C:/Apache24/conf/certs/stats.crt"
    SSLCertificateKeyFile "C:/Apache24/conf/certs/stats.key"

    # --- Proxy inverso ---------------------------------------------------------
    ProxyRequests Off
    ProxyPreserveHost On

    # Los análisis usan el perfil de timeout "heavy" (300 s por defecto).
    # Apache debe esperar más que el servicio; si amplías el del servicio, amplía esto.
    ProxyTimeout 330

    # TLS termina aquí: el servicio necesita saber que el cliente usó https.
    # (X-Forwarded-For lo añade mod_proxy automáticamente; el servicio lo usa para el
    #  rate limit por IP cuando StatisticEngine__Proxy__Enabled=true.)
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:5080/
    ProxyPassReverse / http://127.0.0.1:5080/

    # Cuerpo máximo coherente con Kestrel (StatisticEngine:Limits:MaxRequestBodyBytes = 32 MiB)
    LimitRequestBody 33554432

    # Compresión de respuestas JSON (opcional; requiere deflate + filter)
    AddOutputFilterByType DEFLATE application/json application/problem+json text/html text/plain

    ErrorLog  "logs/statisticengine-error.log"
    CustomLog "logs/statisticengine-access.log" combined
</VirtualHost>

# Redirección de HTTP a HTTPS (opcional; requiere rewrite).
<VirtualHost *:80>
    ServerName stats.example.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
